version: "3.7"

services:
  eletric_invoices_db:
    image: postgres
    container_name: eletric_invoices_db
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=eletric_invoices_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: eletric_invoices
    ports:
      - 3334:3334
    volumes:
      - .:/usr/app
    depends_on:
      eletric_invoices_db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
